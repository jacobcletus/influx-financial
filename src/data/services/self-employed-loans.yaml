title: Self-Employed Loans
navLabel: Self-Employed Loans
seoTitle: Self-Employed Home Loans Melbourne | Influx Financial
metaDescription: Home loans for business owners, contractors and freelancers. Brokers and accountants under one roof make business income make sense to lenders.
h1: Home loans that understand business income
icon: briefcase
order: 9
intro: >-
  Running your own business shouldn't make buying a home harder, but banks
  built their processes around payslips. Self-employed income needs
  translating: add-backs, retained profits, company structures, and the story
  behind a COVID-year dip. This is where Influx is genuinely different, our
  brokers and our accounting arm work on your application together.
whoFor:
  - Business owners with company or trust structures
  - Sole traders, contractors and freelancers
  - Self-employed buyers knocked back because "the financials were too hard"
  - Business owners whose taxable income understates their real position
challenges:
  - title: Your tax return works against you
    body: >-
      Good accountants minimise taxable income, then lenders assess you on
      exactly that number. Depreciation, one-offs and super contributions can
      be added back, but only if someone presents them properly.
  - title: Two years of financials isn't always there
    body: >-
      Newly self-employed borrowers, or those with a strong recent year, can
      struggle with standard policy even when the business is thriving.
  - title: Every lender reads financials differently
    body: >-
      Some average two years, some take the latest, some accept alt-doc
      declarations. The same business can support very different loan sizes
      depending on the lender.
howWeHelp:
  - title: Broker and accountant, same team
    body: >-
      Through OneHQ Accounting we understand your financials at the level a
      credit assessor does, and we can prepare accountant declarations and
      interim figures in-house when a lender needs them.
  - title: Income presented at its true strength
    body: >-
      Add-backs identified, structures explained, and the lender chosen for
      how it treats your specific income pattern, latest year, averaged, or
      alt-doc.
  - title: A plan if the timing isn't right
    body: >-
      If your financials genuinely can't support the loan yet, we'll tell
      you, and map what the next tax return needs to look like to get there.
process:
  - title: Financials review
    body: We review your returns and statements the way a lender will, before a lender does.
  - title: Borrowing power across lenders
    body: Your capacity calculated under different lender policies, including alt-doc paths.
  - title: Lender selection
    body: Chosen for income treatment first, then rate.
  - title: Application with the story told
    body: We lodge with the context and documents that pre-empt assessor questions.
  - title: Settlement & tax alignment
    body: Post-settlement, the accounting team keeps your finances lender-ready for next time.
considerations:
  - Most full-doc lenders want two years of returns; some accept one strong year.
  - Alt-doc (low-doc) loans use accountant declarations or BAS instead of full financials, usually at slightly higher rates.
  - Company and trust structures are fine, but the lender must suit the structure.
  - Timing an application shortly after your tax return is lodged often maximises usable income.
faqs:
  - question: How many years of financials do I need?
    answer: >-
      Standard policy is two years of tax returns, but several lenders can
      work with one year, and alt-doc options exist where returns aren't
      ready. The trade-off is usually rate, we lay out each path.
  - question: What are add-backs?
    answer: >-
      Expenses in your returns that lenders agree don't reduce your real
      capacity, commonly depreciation, one-off costs, interest on debts
      being refinanced, and voluntary super above the minimum. Identifying
      them properly can lift your assessable income substantially.
  - question: I was declined by my bank. Is that final?
    answer: >-
      No. Banks apply their own policy to your financials. A different lender, or the same financials presented with proper add-backs and context,
      frequently produces a different answer.
  - question: Do alt-doc loans cost more?
    answer: >-
      Generally yes, moderately, the lender is accepting less documentation.
      Many clients start alt-doc and refinance to full-doc pricing once two
      clean years of returns exist.
