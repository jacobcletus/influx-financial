category: Refinancing & loan reviews
order: 4
items:
  - question: When is it worth refinancing?
    answer: >-
      Common triggers are a rate noticeably above what new customers are
      offered, the end of a fixed term, a change in your circumstances, or
      wanting to access equity for renovations or investment. Whether it is
      worth it depends on the savings after switching costs — we run that
      comparison for you with real numbers before you commit.
  - question: What does refinancing cost?
    answer: >-
      Typical costs include a discharge fee from your current lender,
      government registration fees, and sometimes application or valuation
      fees with the new lender. Breaking a fixed-rate loan early can incur
      break costs, which vary with market rates. Some lenders offer rebates
      that offset part of these costs. We set out the full picture before you
      decide.
  - question: How often should I review my home loan?
    answer: >-
      A quick review every couple of years — or whenever your fixed term is
      ending or your circumstances change — is a good habit. Lenders often
      reserve their sharpest pricing for new customers, so a periodic check
      keeps your loan honest. We offer this as an ongoing service to our
      clients.
  - question: Can I refinance if my property has fallen in value?
    answer: >-
      It can be harder, because your loan-to-value ratio may be higher than
      when you bought. Options depend on your equity, income and lender
      policy. Even if refinancing elsewhere is not viable right now, we can
      often negotiate with your existing lender or plan the timing.
