category: Working with a broker
order: 1
items:
  - question: What does a mortgage broker actually do?
    answer: >-
      A mortgage broker compares loan options from a panel of lenders on your
      behalf, recommends options suited to your situation, prepares and lodges
      your application, and manages the process through to settlement. Brokers
      must comply with a best interests duty when providing credit assistance
      to consumers, which means acting in your best interests when recommending
      a loan.
  - question: How much does it cost to use Influx Financial?
    answer: >-
      For most residential home loans, our broking service is provided at no
      direct cost to you, we are paid a commission by the lender you choose
      once your loan settles. Any commissions and how we are paid are disclosed
      to you in writing before you apply. Some complex or commercial
      scenarios may involve a fee, which we always agree with you in writing
      first.
  - question: Is a broker better than going straight to my bank?
    answer: >-
      Your bank can only offer its own products. A broker compares options from
      many lenders, which matters because lenders assess income, deposits and
      property types differently, the lender that suits your neighbour may
      decline your application, and vice versa. We also handle the paperwork
      and follow-ups so you deal with one point of contact.
  - question: Do you only help clients in Melbourne?
    answer: >-
      We are based in Melbourne and most of our clients are in Victoria, but we
      work with clients across Australia through phone and video appointments.
      Loan applications are handled electronically end to end.
  - question: What is the difference between Influx Financial and OneHQ Accounting?
    answer: >-
      Influx Financial provides mortgage broking and lending services. OneHQ
      Accounting, led by the same directors, provides accounting and tax
      services. Having both under one roof means your loan strategy and tax
      position can be considered together, particularly useful for
      self-employed borrowers and property investors.
