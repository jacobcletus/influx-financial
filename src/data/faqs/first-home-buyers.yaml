category: First home buyers
order: 3
items:
  - question: How much deposit do I really need?
    answer: >-
      Many lenders prefer a 20% deposit, but buying with less is common —
      typically with lenders mortgage insurance, a guarantor, or through a
      government low-deposit scheme if you are eligible. The right path depends
      on your savings, income and the property. We map out what is realistic
      for your numbers before you start inspecting.
  - question: What government help is available for first home buyers?
    answer: >-
      Support can include first home owner grants, stamp duty concessions and
      low-deposit guarantee schemes. Eligibility rules, price caps and places
      change regularly and differ by state. We check what you may be eligible
      for at the time you apply, using current government criteria.
  - question: Should I get pre-approval before going to inspections?
    answer: >-
      Yes, in most cases. Pre-approval tells you your realistic budget, shows
      agents you are a serious buyer, and means you can sign a contract or bid
      at auction with more confidence. Buying at auction is unconditional in
      Victoria, so knowing your finance position beforehand is especially
      important.
  - question: How long does it take to buy a first home?
    answer: >-
      From first appointment to settlement, most first home buyers take a few
      months — allowing time for pre-approval, house hunting, formal approval
      and a typical 30–60 day settlement. The house-hunting stage is usually
      the longest and the most variable.
