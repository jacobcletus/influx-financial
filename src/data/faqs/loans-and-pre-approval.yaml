category: Loans & pre-approval
order: 2
items:
  - question: What is pre-approval and do I need it?
    answer: >-
      Pre-approval (also called conditional approval) is a lender's indication
      of how much they are prepared to lend you, based on an assessment of your
      income, debts and deposit. It is not a guarantee, but it lets you house
      hunt with a realistic budget and act quickly when you find a property.
      Most pre-approvals last around 90 days and can usually be renewed.
  - question: How long does a home loan application take?
    answer: >-
      It varies by lender and how complete your paperwork is. Some lenders
      assess straightforward applications within a few business days; others
      take longer, particularly for complex income or construction loans. We
      track lender turnaround times and factor them into our recommendation
      when timing matters.
  - question: What documents will I need?
    answer: >-
      Typically photo ID, recent payslips or business financials, bank
      statements, and statements for any existing loans or credit cards. The
      exact list depends on the lender and your situation, we give you a
      personalised checklist up front so nothing holds up your application.
  - question: Will getting a pre-approval affect my credit score?
    answer: >-
      Most lenders run a credit check as part of pre-approval, which leaves an
      enquiry on your credit file. One or two enquiries are normal; many
      enquiries in a short period can affect how lenders view your file. This
      is one reason to compare options with a broker first rather than applying
      to multiple lenders directly.
  - question: What is lenders mortgage insurance (LMI)?
    answer: >-
      LMI is insurance that protects the lender (not you) if you default on
      your loan. Lenders generally require it when you borrow more than 80% of
      a property's value. It can be a significant cost, though some buyers are
      eligible for LMI waivers or government schemes that reduce or avoid it,
      we assess this as part of your options.
